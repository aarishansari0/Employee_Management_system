<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Sign up</h2>

    <!-- Only inputs inside form -->
    <form id="signup-link">
      <label for="username">Username:</label>
      <input type="text" id="username" required />

      <label for="password">Password:</label>
      <input type="password" id="password" required />

      <label for="company_id">company_id:</label>
      <input type="text" id="company_id" required />

      <label for="passkey">passkey (only req for signup):</label>
      <input type="password" id="passkey" />

      <label for="role">Role:</label>
      <select id="role">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Sign up</button>
      <p>Have an account?<a href="index.html">Login</a></p>

    </form>

    <!-- Signup link outside form to prevent accidental submission -->
    
  </div>

  <script src="sign_up.js"></script>
</body>
</html>
