<!DOCTYPE html>
<html>
<head>
  <title>Project Board</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none;
    }

    .modal-content {
      background: var(--container-bg);
      padding: 2rem;
      border-radius: 12px;
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<div class="board-container">

  <div class="board-header">
    <h2>Project Board</h2>
    <button onclick="openAddModal()">+ Add Project</button>
  </div>

  <div class="board">
    <div class="column" id="todo">
      <h2>To Do</h2>
      <div class="cards"></div>
    </div>

    <div class="column" id="in_progress">
      <h2>In Progress</h2>
      <div class="cards"></div>
    </div>

    <div class="column" id="completed">
      <h2>Completed</h2>
      <div class="cards"></div>
    </div>
  </div>

  <button id="back">Back to Home</button>

</div>

<!-- Modal OUTSIDE layout -->
<div id="projectModal" class="modal hidden">
  <div class="modal-content">
    <h3>Add Project</h3>

    <input type="text" id="projectName" placeholder="Project Name" />
    <input type="text" id="projectTeam" placeholder="Team Name" />
    <input type="date" id="projectDeadline" />

    <div class="modal-actions">
      <button id="saveProject">Save</button>
      <button id="closeModal">Cancel</button>
    </div>
  </div>
</div>

<script src="project.js"></script>

</body>
</html>
