<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Task</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Add Task</h2>
    <form id="task-form">
      <label>Date:</label>
      <input type="date" id="task-date" required />

      <label>Start Time:</label>
      <input type="number" id="start-hour" placeholder="Hour" min="1" max="12" required />
      <input type="number" id="start-minute" placeholder="Minute" min="0" max="59" required />
      <select id="start-period">
        <option>AM</option>
        <option>PM</option>
      </select>

      <label>End Time:</label>
      <input type="number" id="end-hour" placeholder="Hour" min="1" max="12" required />
      <input type="number" id="end-minute" placeholder="Minute" min="0" max="59" required />
      <select id="end-period">
        <option>AM</option>
        <option>PM</option>
      </select>

      <label>Note:</label>
      <textarea id="note" rows="3" placeholder="Optional note..."></textarea>

      <button type="submit">Add Task</button>
    </form>
  <button id="back">Back</button>
  </div>
  <script src="add_task.js"></script>
</body>
</html>
