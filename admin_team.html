<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Team Management</title>

<style>
/* ===== GLOBAL ===== */
body {
  background: #0d0d0d;
  color: #e0ffe0;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 20px;
}

/* ===== CONTAINER ===== */
.container {
  max-width: 1200px;
  margin: auto;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.header h1 {
  color: #00ff99;
  letter-spacing: 1px;
}

/* ===== BUTTONS ===== */
button {
  background: transparent;
  border: 1px solid #00ff99;
  color: #00ff99;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: #00ff99;
  color: black;
  box-shadow: 0 0 10px #00ff99;
}

/* ===== TEAM CARD ===== */
.team-card {
  background: #121212;
  border: 1px solid #1f1f1f;
  border-left: 4px solid #00ff99;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,255,153,0.05);
  transition: 0.25s;
}

.team-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px rgba(0,255,153,0.2);
}

/* ===== TEAM TITLE ===== */
.team-card h3 {
  margin: 0 0 8px;
  color: #00ff99;
}

/* ===== MEMBERS ===== */
.member {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #1a1a1a;
  border: 1px solid #00ff99;
  padding: 5px 10px;
  border-radius: 20px;
  margin: 4px;
  font-size: 13px;
}

/* Remove button */
.member button {
  border: none;
  background: transparent;
  color: #ff6666;
  cursor: pointer;
}

/* ===== INPUT ===== */
input {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: #00ff99;
}

/* ===== MODAL ===== */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
}

.hidden {
  display: none;
}

.modal-content {
  background: #121212;
  padding: 25px;
  border-radius: 12px;
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border: 1px solid #00ff99;
}

/* ===== MEMBER CHIP (MODAL) ===== */
.member-chip {
  background: #00ff99;
  color: black;
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex;
  gap: 6px;
  margin: 4px;
}

.member-chip span {
  cursor: pointer;
  color: red;
}

/* BACK BUTTON */
#back {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Admin Team Panel</h1>
    <button onclick="openAddTeamModal()">+ Create Team</button>
  </div>

  <div id="teamList"></div>

  <button id="back">⬅ Back</button>

</div>

<!-- MODAL -->
<div id="teamModal" class="modal hidden">
  <div class="modal-content">
    <h3>Create Team</h3>

    <input id="teamNameInput" placeholder="Team name">

    <input id="memberInput" placeholder="Add member username">
    <button onclick="addMember()">Add Member</button>

    <div id="memberList"></div>

    <button onclick="createTeam()">Create</button>
    <button onclick="closeTeamModal()">Cancel</button>
  </div>
</div>

<script src="admin_team.js"></script>
</body>
</html>
